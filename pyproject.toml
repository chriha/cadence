[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadence"
version = "0.1.0"
description = "A keyboard-driven terminal dashboard for shell tasks that run on schedules, git changes, file changes and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Christopher Hartmann" }]
keywords = ["tui", "scheduler", "cron", "task-runner", "textual", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]
dependencies = ["textual>=0.80", "tomlkit>=0.12", "croniter>=2.0"]

[project.scripts]
cadence = "cadence.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
